<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>해보고 싶은 것들</title>
<style>
:root{--bg:#F3F5F6;--card:#fff;--ink:#15202A;--muted:#5B6873;--line:#D5DCE0;--accent:#6E5AA6;--danger:#B54343;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#A898DD;--danger:#F08B8B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#A898DD;--danger:#F08B8B;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.wrap{max-width:820px;margin:0 auto;padding:22px 16px 40px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}h1{font-size:24px;margin:0 0 4px}.sub{margin:0;color:var(--muted);font-size:13px}.progress{min-width:115px;text-align:right}.progress b{display:block;font-size:20px}.progress span{font-size:12px;color:var(--muted)}.pbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}.add{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px}.add input,.add select{min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit}.add button,.seg button,.act button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}.add button{padding:10px 16px;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 10px}.seg{display:flex;gap:4px}.seg button{padding:7px 11px;font-size:13px}.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.count{font-size:12px;color:var(--muted)}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px}.row.done{opacity:.68}.row.done .title{text-decoration:line-through}.check{width:23px;height:23px;accent-color:var(--accent);cursor:pointer}.main{min-width:0}.title{font-weight:700;line-height:1.35;overflow-wrap:anywhere}.meta{display:flex;gap:7px;align-items:center;margin-top:4px;color:var(--muted);font-size:11.5px}.tag{padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:700}.act{display:flex;gap:4px}.act button{padding:6px 8px;font-size:12px;color:var(--muted)}.act .del{color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:36px 12px;background:var(--card);border:1px dashed var(--line);border-radius:13px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 12px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}
@media(max-width:620px){.wrap{padding:16px 12px 28px}.head{align-items:flex-start}.progress{min-width:92px}.add{grid-template-columns:minmax(0,1fr) auto}.add select{grid-column:1/2}.add button{grid-row:1/3;grid-column:2}.row{grid-template-columns:auto minmax(0,1fr)}.act{grid-column:2;justify-content:flex-end}.toolbar{align-items:flex-start;flex-direction:column}.seg{width:100%}.seg button{flex:1}.count{padding-left:2px}}
</style></head><body>
<div class="wrap">
  <div class="head"><div><h1>해보고 싶은 것들</h1><p class="sub">하고 싶은 일을 쌓아두고, 해낸 것은 바로 체크.</p></div><div class="progress"><b id="ratio">0 / 0</b><span id="pct">0% 완료</span><div class="pbar"><i id="bar" style="width:0%"></i></div></div></div>
  <div class="panel"><form class="add" id="addForm"><input id="newTitle" maxlength="80" autocomplete="off" placeholder="새로 해보고 싶은 것"><select id="newCat"><option>도전</option><option>마라톤</option><option>여행</option><option>스포츠</option><option>사진</option><option>음악</option><option>언어</option><option>자격·요리</option><option selected>기타</option></select><button type="submit">추가</button></form></div>
  <div class="toolbar"><div class="seg" id="seg"><button type="button" data-filter="all" class="on">전체</button><button type="button" data-filter="todo">미완료</button><button type="button" data-filter="done">완료</button></div><div class="count" id="count"></div></div>
  <div class="list" id="list"></div>
</div><div class="toast" id="toast"></div>
<script>
(()=>{
const APP='wishlist', KEY='inputs';
const goals=[
 ['UTMB Finals 완주','도전'],['TMB','도전'],['파타고니아 여행','여행'],['산티아고 순례길 완주','여행'],['부부 국토종주','도전'],['호빗 마라톤','마라톤'],['융프라우 마라톤','마라톤'],['8대 마라톤 완주','마라톤'],['서브3','도전'],['백두대간','도전'],
 ['보스포러스 해협 횡단 수영','스포츠'],['프리다이빙 배우기','스포츠'],['서핑 배우기','스포츠'],['해외 스키여행','여행'],['클라이밍','스포츠'],['트라이애슬론 텐언더','도전'],
 ['사진전 열기','사진'],['기타 배우기','음악'],['피아노 배우기','음악'],
 ['한식 조리사','자격·요리'],['중식 조리사','자격·요리'],['일식 조리사','자격·요리'],['양식 조리사','자격·요리'],['제과기능사','자격·요리'],['제빵기능사','자격·요리'],['바리스타 · SCA Barista Skills Intermediate','자격·요리'],['소믈리에/와인 · WSET Level 2','자격·요리'],
 ['프랑스어 회화 · DELF B1','언어'],['독일어 회화 · Goethe-Zertifikat B1','언어'],['이탈리아어 회화 · CILS UNO-B1','언어'],['스페인어 회화 · DELE B1','언어'],['일본어 회화 · JSST Level 7+','언어']
];
const aliases={
 'UTMB':'UTMB Finals 완주','8대 마라톤':'8대 마라톤 완주',
 '프랑스어':'프랑스어 회화 · DELF B1','독일어':'독일어 회화 · Goethe-Zertifikat B1','이탈리아어':'이탈리아어 회화 · CILS UNO-B1','스페인어':'스페인어 회화 · DELE B1','일본어':'일본어 회화 · JSST Level 7+'
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), now=()=>new Date().toISOString();
const makeSeed=()=>({version:2,items:goals.map((x,i)=>({id:'goal-'+(i+1),title:x[0],category:x[1],done:false,createdAt:now(),completedAt:null}))});
let state={version:2,items:[]}, filter='all';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));
const sb=parent&&parent.__hh&&parent.__hh.sb;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1500)}
function migrate(){
 let changed=false;
 state.items=(state.items||[]).map(x=>{const to=aliases[x.title];if(to){changed=true;return {...x,title:to}}return x});
 const byTitle=new Set(state.items.map(x=>x.title));
 goals.forEach(([title,category])=>{if(!byTitle.has(title)){state.items.push({id:uid(),title,category,done:false,createdAt:now(),completedAt:null});byTitle.add(title);changed=true}});
 if(state.version!==2){state.version=2;changed=true}
 return changed;
}
async function load(){
 if(!sb){$('list').innerHTML='<div class="empty">저장 연결을 불러오지 못했습니다.</div>';return}
 const {data,error}=await sb.from('app_state').select('data').eq('app',APP).eq('key',KEY).maybeSingle();
 if(error){console.warn(error);toast('목록을 불러오지 못했습니다');return}
 if(data&&data.data&&Array.isArray(data.data.items)){state=data.data;const changed=migrate();if(changed)await save(true)}else{state=makeSeed();await save(true)}
 render();
}
async function save(silent){
 if(!sb)return;
 const {error}=await sb.from('app_state').upsert({app:APP,key:KEY,data:state,updated_at:now()});
 if(error){console.warn(error);toast('저장에 실패했습니다')}else if(!silent)toast('저장됨');
}
function sortedItems(){return [...state.items].sort((a,b)=>(a.done-b.done)||((a.category||'').localeCompare(b.category||'','ko'))||((a.createdAt||'').localeCompare(b.createdAt||'')))}
function render(){
 const total=state.items.length, done=state.items.filter(x=>x.done).length, pct=total?Math.round(done/total*100):0;
 $('ratio').textContent=done+' / '+total;$('pct').textContent=pct+'% 완료';$('bar').style.width=pct+'%';
 let rows=sortedItems();if(filter==='todo')rows=rows.filter(x=>!x.done);if(filter==='done')rows=rows.filter(x=>x.done);
 $('count').textContent=filter==='all'?`미완료 ${total-done} · 완료 ${done}`:`${rows.length}개`;
 $('list').innerHTML=rows.length?rows.map(x=>`<div class="row${x.done?' done':''}" data-id="${esc(x.id)}"><input class="check" type="checkbox" ${x.done?'checked':''} aria-label="완료 체크"><div class="main"><div class="title">${esc(x.title)}</div><div class="meta"><span class="tag">${esc(x.category||'기타')}</span>${x.done&&x.completedAt?'<span>'+new Date(x.completedAt).toLocaleDateString('ko-KR')+' 완료</span>':''}</div></div><div class="act"><button type="button" data-act="edit">수정</button><button type="button" class="del" data-act="del">삭제</button></div></div>`).join(''):'<div class="empty">표시할 항목이 없습니다.</div>';
}
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const title=$('newTitle').value.trim();if(!title)return;$('newTitle').value='';state.items.push({id:uid(),title,category:$('newCat').value,done:false,createdAt:now(),completedAt:null});render();await save(false);$('newTitle').focus()});
$('seg').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('list').addEventListener('change',async e=>{if(!e.target.classList.contains('check'))return;const row=e.target.closest('.row'),x=state.items.find(v=>v.id===row.dataset.id);if(!x)return;x.done=e.target.checked;x.completedAt=x.done?now():null;render();await save(false)});
$('list').addEventListener('click',async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const row=b.closest('.row'),x=state.items.find(v=>v.id===row.dataset.id);if(!x)return;if(b.dataset.act==='edit'){const t=prompt('항목 이름',x.title);if(t===null)return;const v=t.trim();if(!v)return;const c=prompt('분류',x.category||'기타');x.title=v;if(c!==null&&c.trim())x.category=c.trim();render();await save(false)}else if(b.dataset.act==='del'){if(!confirm('"'+x.title+'" 항목을 삭제할까요?'))return;state.items=state.items.filter(v=>v.id!==x.id);render();await save(false)}});
load();
})();
</script></body></html>
