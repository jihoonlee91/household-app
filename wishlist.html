<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>해보고 싶은 것들</title>
<style>
:root{--bg:#F3F5F6;--card:#fff;--ink:#15202A;--muted:#5B6873;--line:#D5DCE0;--accent:#6E5AA6;--danger:#B54343;--ph:#1B232A;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#A898DD;--accent-ink:#15121f;--danger:#F08B8B;--ph:#0A0F13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#A898DD;--accent-ink:#15121f;--danger:#F08B8B;--ph:#0A0F13;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:10px 12px 24px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-size:18px;margin:0}
.prog{font-size:12px;color:var(--muted);white-space:nowrap}.prog b{color:var(--ink);font-size:14px}
.pbar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin:5px 0 8px}.pbar i{display:block;height:100%;background:var(--accent)}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:5px;margin-bottom:8px}
.add input,.add select{min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 8px;font:inherit}
.add button{border:0;background:var(--accent);color:var(--accent-ink,#fff);border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sec{margin:12px 0 5px;font-size:12px;font-weight:700;color:var(--muted)}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;min-width:0}
.ph{position:relative;height:76px;background:var(--ph);display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph .emo{font-size:28px;opacity:.85}
.check{position:absolute;top:4px;left:4px;width:22px;height:22px;margin:0;accent-color:var(--accent);cursor:pointer}
.cr{position:absolute;left:0;right:0;bottom:0;padding:1px 4px;font-size:8.5px;line-height:1.35;color:#fff;background:rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.body{padding:4px 6px 5px;display:flex;flex-direction:column;gap:2px;flex:1}
.title{font-weight:700;font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:4px;margin-top:auto;font-size:10.5px;color:var(--muted);min-width:0}
.tag{padding:0 5px;border-radius:99px;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);font-weight:700;white-space:nowrap}
.due{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0}
.due input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.due.over{color:var(--danger);font-weight:700}.due.soon{color:var(--accent);font-weight:700}
.more{margin-left:auto;flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;line-height:1;padding:2px 4px;cursor:pointer}
.card.done .ph img{filter:grayscale(.7);opacity:.7}.card.done .title{text-decoration:line-through;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:20px 8px;border:1px dashed var(--line);border-radius:9px}
.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:7px 10px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}
@media(max-width:640px){.wrap{padding:8px 8px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.ph{height:64px}.add select{width:84px}.more{padding:4px 6px}}
</style></head><body>
<div class="wrap">
  <div class="head"><h1>해보고 싶은 것들</h1><span class="prog"><b id="ratio">0 / 0</b> 완료</span></div>
  <div class="pbar"><i id="bar" style="width:0%"></i></div>
  <form class="add" id="addForm"><input id="newTitle" maxlength="80" autocomplete="off" placeholder="새로 해보고 싶은 것"><select id="newCat" aria-label="분류"><option>도전</option><option>마라톤</option><option>여행</option><option>스포츠</option><option>사진</option><option>음악</option><option>언어</option><option>자격</option><option>자격·요리</option><option selected>기타</option></select><button type="submit">추가</button></form>
  <div class="grid" id="todo"></div>
  <div class="sec" id="doneHead" hidden></div>
  <div class="grid" id="done"></div>
</div><div class="toast" id="toast"></div>
<script>
(()=>{
const APP='wishlist', KEY='inputs';
const goals=[
 ['UTMB Finals 완주','도전'],['TMB','도전'],['파타고니아 여행','여행'],['산티아고 순례길 완주','여행'],['부부 국토종주','도전'],['호빗 마라톤','마라톤'],['융프라우 마라톤','마라톤'],['8대 마라톤 완주','마라톤'],['서브3','도전'],['백두대간','도전'],
 ['보스포러스 해협 횡단 수영','스포츠'],['프리다이빙 배우기','스포츠'],['서핑 배우기','스포츠'],['해외 스키여행','여행'],['클라이밍','스포츠'],['트라이애슬론 텐언더','도전'],
 ['사진전 열기','사진'],['기타 배우기','음악'],['피아노 배우기','음악'],
 ['한식 조리사','자격·요리'],['중식 조리사','자격·요리'],['일식 조리사','자격·요리'],['양식 조리사','자격·요리'],['제과기능사','자격·요리'],['제빵기능사','자격·요리'],['바리스타 · SCA Barista Skills Intermediate','자격·요리'],['소믈리에/와인 · WSET Level 2','자격·요리'],
 ['프랑스어 회화 · DELF B1','언어'],['독일어 회화 · Goethe-Zertifikat B1','언어'],['이탈리아어 회화 · CILS UNO-B1','언어'],['스페인어 회화 · DELE B1','언어'],['일본어 회화 · JSST Level 7+','언어']
];
const completedGoals=[
 ['풀 아이언맨 완주','도전'],['국토종주 완주 (이지훈)','도전'],['라이프가드','자격'],['수상구조사','자격'],['생활체육지도사 (수영)','자격'],['조정 심판','자격']
];
const aliases={
 'UTMB':'UTMB Finals 완주','8대 마라톤':'8대 마라톤 완주',
 '프랑스어':'프랑스어 회화 · DELF B1','독일어':'독일어 회화 · Goethe-Zertifikat B1','이탈리아어':'이탈리아어 회화 · CILS UNO-B1','스페인어':'스페인어 회화 · DELE B1','일본어':'일본어 회화 · JSST Level 7+'
};
const EMO={'도전':'🏔️','마라톤':'🏃','여행':'✈️','스포츠':'🏊','사진':'📷','음악':'🎵','언어':'🗣️','자격':'🎖️','자격·요리':'🍳'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), now=()=>new Date().toISOString();
const makeSeed=()=>({version:3,items:[...goals.map((x,i)=>({id:'goal-'+(i+1),title:x[0],category:x[1],done:false,createdAt:now(),completedAt:null})),...completedGoals.map((x,i)=>({id:'done-'+(i+1),title:x[0],category:x[1],done:true,createdAt:now(),completedAt:null}))]});
let state={version:3,items:[]};
/* 기한(예정): 'YYYY-MM' */
const ymNow=()=>{const d=new Date();return d.getFullYear()*12+d.getMonth()};
const ymDiff=v=>{const [y,m]=v.split('-').map(Number);return y*12+m-1-ymNow()};
const dueTxt=v=>{const n=ymDiff(v);return n<0?'기한 지남':n===0?'이번 달':n<12?`${n}개월 뒤`:v.slice(2).replace('-','.')};
const dueCls=x=>{if(!x.due||x.done)return '';const n=ymDiff(x.due);return n<0?' over':n<12?' soon':''};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl=u=>/^https:\/\//.test(u||'')?u:'';
const sb=parent&&parent.__hh&&parent.__hh.sb;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1500)}
function migrate(){
 let changed=false;
 state.items=(state.items||[]).map(x=>{const to=aliases[x.title];if(to){changed=true;return {...x,title:to}}return x});
 const byTitle=new Set(state.items.map(x=>x.title));
 goals.forEach(([title,category])=>{if(!byTitle.has(title)){state.items.push({id:uid(),title,category,done:false,createdAt:now(),completedAt:null});byTitle.add(title);changed=true}});
 completedGoals.forEach(([title,category])=>{if(!byTitle.has(title)){state.items.push({id:uid(),title,category,done:true,createdAt:now(),completedAt:null});byTitle.add(title);changed=true}});
 if(state.version!==3){state.version=3;changed=true}
 return changed;
}
async function load(){
 if(!sb){$('todo').innerHTML='<div class="empty">저장 연결을 불러오지 못했습니다.</div>';return}
 const {data,error}=await sb.from('app_state').select('data').eq('app',APP).eq('key',KEY).maybeSingle();
 if(error){console.warn(error);toast('목록을 불러오지 못했습니다');return}
 if(data&&data.data&&Array.isArray(data.data.items)){state=data.data;const changed=migrate();if(changed)await save(true)}else{state=makeSeed();await save(true)}
 render();
}
async function save(silent){
 if(!sb)return;
 const {error}=await sb.from('app_state').upsert({app:APP,key:KEY,data:state,updated_at:now()});
 if(error){console.warn(error);toast('저장에 실패했습니다')}else if(!silent)toast('저장됨');
}
/* 새 항목 사진: 한국어 위키백과 검색 → 자유 라이선스(위키미디어 공용) 사진만, 출처와 함께 저장 */
async function autoPhoto(x){
 try{
  const q=x.title.split('·')[0].replace(/배우기|완주|여행|열기/g,'').trim()||x.title;
  const w=await (await fetch('https://ko.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&prop=pageimages&piprop=name&pilicense=free&gsrsearch='+encodeURIComponent(q))).json();
  const pg=w.query&&Object.values(w.query.pages||{})[0];if(!pg||!pg.pageimage)return;
  const c=await (await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=360&titles='+encodeURIComponent('File:'+pg.pageimage))).json();
  const p=c.query&&Object.values(c.query.pages||{})[0], ii=p&&p.imageinfo&&p.imageinfo[0];if(!ii)return;
  const md=ii.extmetadata||{}, txt=v=>{const d=document.createElement('div');d.innerHTML=String(v&&v.value||'');return d.textContent.replace(/\s+/g,' ').trim()};
  if(txt(md.NonFree)==='true')return;
  x.photo_url=ii.thumburl||ii.url;x.photo_credit=`${txt(md.Artist).slice(0,60)||'작자 미상'} · ${txt(md.LicenseShortName)||'출처 표기'} · 위키미디어 공용`;x.photo_source=ii.descriptionurl;
  render();await save(true);
 }catch(e){console.warn('photo',e)}
}
function card(x){
 const img=safeUrl(x.photo_url), src=safeUrl(x.photo_source);
 const ph=img?`<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">${x.photo_credit?`<a class="cr" ${src?`href="${esc(src)}" target="_blank" rel="noopener"`:''} title="${esc(x.photo_credit)}">${esc(x.photo_credit)}</a>`:''}`:`<span class="emo">${EMO[x.category]||'✨'}</span>`;
 const meta=x.done?(x.completedAt?`<span>${new Date(x.completedAt).toLocaleDateString('ko-KR',{year:'2-digit',month:'numeric'})}</span>`:'')
  :`<label class="due${dueCls(x)}" title="기한(예정)${x.due?' '+esc(x.due.replace('-','.')):''}">${x.due?esc(dueTxt(x.due)):'기한 +'}<input type="month" data-due value="${esc(x.due||'')}" aria-label="기한(예정)"></label>`;
 return `<div class="card${x.done?' done':''}" data-id="${esc(x.id)}"><div class="ph">${ph}<input class="check" type="checkbox" ${x.done?'checked':''} aria-label="완료 체크"></div><div class="body"><div class="title" title="${esc(x.title)}">${esc(x.title)}</div><div class="meta"><span class="tag">${esc(x.category||'기타')}</span>${meta}<button type="button" class="more" aria-label="수정·삭제">⋯</button></div></div></div>`;
}
function render(){
 const items=state.items, done=items.filter(x=>x.done), todo=items.filter(x=>!x.done), total=items.length, pct=total?Math.round(done.length/total*100):0;
 $('ratio').textContent=done.length+' / '+total;$('bar').style.width=pct+'%';
 const byCat=(a,b)=>((a.category||'').localeCompare(b.category||'','ko'))||((a.createdAt||'').localeCompare(b.createdAt||''));
 todo.sort((a,b)=>((a.due||'9999').localeCompare(b.due||'9999'))||byCat(a,b));
 done.sort((a,b)=>((b.completedAt||'').localeCompare(a.completedAt||''))||byCat(a,b));
 $('todo').innerHTML=todo.length?todo.map(card).join(''):'<div class="empty">모두 해냈어요! 새로 하나 추가해 보세요.</div>';
 $('doneHead').hidden=!done.length;$('doneHead').textContent='해낸 것 '+done.length;
 $('done').innerHTML=done.map(card).join('');
}
const itemOf=el=>{const c=el.closest('.card');return c&&state.items.find(v=>v.id===c.dataset.id)};
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const title=$('newTitle').value.trim();if(!title)return;$('newTitle').value='';const x={id:uid(),title,category:$('newCat').value,due:null,done:false,createdAt:now(),completedAt:null};state.items.push(x);render();await save(false);$('newTitle').focus();autoPhoto(x)});
document.addEventListener('change',async e=>{const x=itemOf(e.target);if(!x)return;
 if(e.target.matches('[data-due]')){x.due=e.target.value||null}
 else if(e.target.classList.contains('check')){x.done=e.target.checked;x.completedAt=x.done?now():null}
 else return;
 render();await save(false)});
document.addEventListener('click',async e=>{
 const d=e.target.closest('[data-due]');if(d){try{d.showPicker&&d.showPicker()}catch(_){}return}
 const b=e.target.closest('.more');if(!b)return;const x=itemOf(b);if(!x)return;
 const t=prompt('항목 이름 (비우면 삭제)',x.title);if(t===null)return;const v=t.trim();
 if(!v){if(!confirm('"'+x.title+'" 항목을 삭제할까요?'))return;state.items=state.items.filter(o=>o.id!==x.id);render();await save(false);return}
 const c=prompt('분류',x.category||'기타');const renamed=v!==x.title;x.title=v;if(c!==null&&c.trim())x.category=c.trim();
 render();await save(false);if(renamed&&!x.photo_url)autoPhoto(x)});
load();
})();
</script><script>/* 좌우 스와이프: 같은 메뉴의 옆 탭으로(셸 __hh.swipe) — 가로 스크롤 영역·입력칸·화면 가장자리에서는 무시 */(()=>{let x0,y0,t0,ok=false;const hs=el=>{for(;el&&el!==document.body;el=el.parentElement){const s=getComputedStyle(el);if(/(auto|scroll)/.test(s.overflowX)&&el.scrollWidth>el.clientWidth+2)return true}return false};
addEventListener("touchstart",e=>{if(e.touches.length!==1){ok=false;return}const t=e.touches[0];ok=t.clientX>16&&t.clientX<innerWidth-16&&!e.target.closest("input,textarea,select,[data-no-swipe],.sheet,dialog[open]")&&!hs(e.target);x0=t.clientX;y0=t.clientY;t0=Date.now()},{passive:true});
addEventListener("touchend",e=>{if(!ok)return;ok=false;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.7||Date.now()-t0>700)return;try{const h=parent.__hh;if(h&&h.swipe)h.swipe(dx<0?"next":"prev")}catch(_){}},{passive:true})})();</script>
</body></html>
