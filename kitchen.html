<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주방용품 · 상지홈</title><style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#20332e;--muted:#687770;--line:#dce3dd;--accent:#28684e;--soft:#eaf3ed;--bad:#ad413b;color-scheme:light}:root[data-theme=dark]{--bg:#111915;--card:#1b2620;--ink:#e3ece6;--muted:#a4b5aa;--line:#35463a;--accent:#91d5ad;--soft:#273c2e;--bad:#ffaaa0;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,'Malgun Gothic',sans-serif}main{max-width:1060px;margin:auto;padding:22px 16px 70px}header,.actions,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between}h1{font-size:26px;margin:0 0 6px}h2{font-size:19px;margin:0 0 18px}p{color:var(--muted);line-height:1.6;margin:6px 0 18px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:10px;min-height:44px}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);background:var(--bg);border-radius:9px}textarea{resize:vertical;min-height:80px}label{display:grid;gap:7px;font-size:13px;color:var(--muted)}.panel,.product{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:20px}.panel{margin:20px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}fieldset{border:0;padding:0;margin:6px 0}legend{font-size:14px;font-weight:650;margin-bottom:10px}.compatrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.compatrow>span{font-size:14px}.choices{display:flex;gap:4px}.choices label{position:relative;display:block;cursor:pointer}.choices input{position:absolute;opacity:0;width:1px;height:1px}.choices span{display:block;border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px;font-size:13px}.choices input:checked+span{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}.choices input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}.formactions{display:flex;gap:8px;margin-top:16px}.tools{margin:20px 0 14px}.tools label:first-child{flex:2}.tools label:last-child{flex:1}.list{display:grid;grid-template-columns:1fr 1fr;gap:14px}.product h3{font-size:18px;margin:0;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:13px;margin-top:6px;overflow-wrap:anywhere}.checks{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin:18px 0}.badge{display:flex;justify-content:space-between;gap:5px;padding:8px;background:var(--bg);border-radius:8px;font-size:12px}.yes{color:var(--accent)}.no{color:var(--bad)}.unknown{color:var(--muted)}.note{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:var(--soft);border-radius:9px;font-size:14px;line-height:1.6}.note small{display:block;color:var(--muted);font-size:11px}.itemactions{display:flex;gap:8px;margin-top:16px}.itemactions button{font-size:13px}.empty{text-align:center;padding:40px 18px;grid-column:1/-1;color:var(--muted)}#status{min-height:24px;font-size:13px;margin-top:12px;color:var(--muted)}#status.error{color:var(--bad)}#count{font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:640px){main{padding:18px 12px 50px}.list,.formgrid{grid-template-columns:1fr}.panel,.product{padding:16px}.tools{align-items:stretch;flex-direction:column}header{align-items:flex-start}h1{font-size:23px}.choices span{padding:9px 8px}.compatrow{gap:6px}header .actions{flex-shrink:0}header .actions button{padding:9px}}
dialog{width:min(900px,calc(100% - 24px));max-height:90vh;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:22px}dialog::backdrop{background:#10241bb0}.detailtabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.detailtabs [aria-selected=true]{background:var(--soft);border-color:var(--accent);font-weight:700}.detailtext{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}.photogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.photogrid img{display:block;width:100%;max-height:420px;object-fit:contain;background:var(--bg)}.photogrid a{color:var(--accent)}.photogrid figure{margin:0;overflow-wrap:anywhere}.uploadlist{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.detailhead{display:flex;justify-content:space-between;align-items:center;gap:10px}</style></head><body><main><header><div><h1>주방용품</h1><p>그릇·식기·텀블러의 스펙과 사용 가능 여부</p></div><div class="actions"><button id="refresh" type="button">새로고침</button><button id="new" type="button" class="primary" disabled>+ 등록</button></div></header><div id="status" role="status" aria-live="polite">목록을 불러오는 중…</div>
<section id="editor" class="panel" hidden><h2 id="formTitle">주방용품 등록</h2><form id="form"><div class="formgrid"><label>제품명 *<input id="name" required maxlength="150" placeholder="예: 스탠리 퀜처 텀블러"></label><label>종류<select id="category"><option>그릇·식기</option><option>컵·텀블러</option><option>밀폐·보관용기</option><option>조리도구</option><option>기타</option></select></label><label>브랜드·모델<input id="brand" maxlength="200" placeholder="예: 브랜드 / 모델명"></label><label>재질<input id="material" maxlength="200" placeholder="예: 도자기, 유리, 스테인리스"></label><fieldset class="full"><legend>사용 가능 여부</legend><div id="compatibility"></div></fieldset><label class="full">비고 (용량·사용 조건)<textarea id="note" maxlength="3000" placeholder="예: 500mL / 본체만 식세기 가능 / 뚜껑 분리 / 오븐 최대 200℃"></textarea></label><label class="full">요리 사용 예시<textarea id="cooking" maxlength="5000" placeholder="예: 만두 찌기, 채소 찜, 남은 음식 데우기 / 직접 해 본 조리법과 메모"></textarea></label><label class="full">상세 스펙<textarea id="specs" maxlength="10000" placeholder="크기, 부품별 내열·내냉 온도, 재질 등"></textarea></label><label class="full">사용법·주의사항<textarea id="instructions" maxlength="10000" placeholder="뚜껑·트레이 사용 조건, 세척·보관 방법 등"></textarea></label><label class="full">제품·설명서 사진 (원본, 최대 6장 · 장당 8MB)<input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><span id="photoDraft" class="uploadlist"></span></label></div><p style="font-size:12px;margin-top:12px">제품 표시를 확인한 항목만 선택해 주세요. 모르는 항목은 ‘미확인’으로 남겨둘 수 있어요.</p><div class="formactions"><button id="save" class="primary" type="submit">저장</button><button id="cancel" type="button">취소</button></div></form></section>
<div class="tools"><label>제품 찾기<input id="search" type="search" placeholder="제품명, 브랜드, 재질, 비고 검색"></label><label>사용 가능한 제품<select id="filter"><option value="">전체</option></select></label></div><div id="count"></div><section id="list" class="list" aria-label="등록한 주방용품" style="margin-top:12px"></section></main><dialog id="detail" aria-labelledby="detailTitle"><div class="detailhead"><h2 id="detailTitle"></h2><button id="closeDetail" type="button">닫기</button></div><div class="detailtabs" role="tablist" aria-label="제품 상세"><button id="tab-specs" role="tab" aria-selected="true" aria-controls="detail-specs" data-tab="specs">상세 스펙</button><button id="tab-usage" role="tab" aria-selected="false" aria-controls="detail-usage" data-tab="usage" tabindex="-1">사용법·요리</button><button id="tab-photos" role="tab" aria-selected="false" aria-controls="detail-photos" data-tab="photos" tabindex="-1">사진 원본</button></div><section id="detail-specs" role="tabpanel" aria-labelledby="tab-specs"></section><section id="detail-usage" role="tabpanel" aria-labelledby="tab-usage" hidden></section><section id="detail-photos" role="tabpanel" aria-labelledby="tab-photos" hidden></section></dialog><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), APP='kitchen', TYPES=[['microwave','전자레인지'],['oven','오븐'],['dishwasher','식기세척기'],['airfryer','에어프라이어'],['freezer','냉동실']], OPTIONS=[['unknown','미확인'],['yes','가능'],['no','불가']];
const sb=parent&&parent.__hh&&parent.__hh.sb;let items=[],editing=null,ready=false,busy=false,draftPhotos=[],photoURLs=[],detailGeneration=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
$('compatibility').innerHTML=TYPES.map(([key,title])=>`<div class="compatrow"><span id="label-${key}">${title}</span><div class="choices" role="radiogroup" aria-labelledby="label-${key}">${OPTIONS.map(([value,text])=>`<label><input type="radio" name="${key}" value="${value}" ${value==='unknown'?'checked':''}><span>${text}</span></label>`).join('')}</div></div>`).join('');
TYPES.forEach(([key,title])=>{const o=document.createElement('option');o.value=key;o.textContent=title+' 가능';$('filter').append(o)});
function lock(value){busy=value;$('form').querySelectorAll('input,select,textarea,button').forEach(e=>e.disabled=value);$('new').disabled=value||!ready;$('refresh').disabled=value;render()}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),filter=$('filter').value;const shown=items.filter(x=>[x.name,x.brand,x.material,x.note,x.category,x.cooking,x.specs,x.instructions].join(' ').toLocaleLowerCase().includes(q)&&(!filter||x.compatibility?.[filter]==='yes'));$('count').textContent=`전체 ${items.length}개 · 표시 ${shown.length}개`;
$('list').innerHTML=shown.length?shown.map(x=>`<article class="product"><h3>${esc(x.name)}</h3><div class="meta">${[x.category,x.brand,x.material].filter(Boolean).map(esc).join(' · ')}</div><div class="checks">${TYPES.map(([key,title])=>{const value=['yes','no'].includes(x.compatibility?.[key])?x.compatibility[key]:'unknown';return `<div class="badge"><span>${title}</span><b class="${value}">${({yes:'✓ 가능',no:'× 불가',unknown:'? 미확인'})[value]}</b></div>`}).join('')}</div>${x.note?`<div class="note"><small>비고 · 용량·사용 조건</small>${esc(x.note)}</div>`:''}${x.cooking?`<p class="detailtext"><b>요리 사용 예시</b><br>${esc(x.cooking)}</p>`:''}<div class="itemactions"><button type="button" data-detail="${esc(x.id)}">상세·사용법·사진</button><button type="button" data-edit="${esc(x.id)}" ${busy?'disabled':''}>수정</button><button type="button" data-delete="${esc(x.id)}" ${busy?'disabled':''}>삭제</button></div></article>`).join(''):`<div class="empty">${!ready?'목록을 불러온 후 사용할 수 있어요.':items.length?'검색 조건에 맞는 제품이 없어요.':'등록한 주방용품이 없어요.<br>제품을 등록하고 사용 가능 여부를 기록해 보세요.'}</div>`;
}
async function load(){lock(true);status('목록을 불러오는 중…');try{if(!sb)throw Error('상지홈에서 로그인한 뒤 열어 주세요.');const {data,error}=await sb.from('app_state').select('key,data').eq('app',APP);if(error)throw error;items=(data||[]).filter(r=>r.key.startsWith('item-')&&r.data&&!r.data.deleted).map(r=>({...r.data,id:r.key})).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));ready=true;status('목록을 불러왔어요.');}catch(e){status('목록을 불러오지 못했어요. '+(e.message||'새로고침으로 다시 시도해 주세요.'),true)}finally{lock(false)}}
function openEditor(item){editing=item?.id||null;$('form').reset();$('name').setCustomValidity('');for(const key of ['name','category','brand','material','note','cooking','specs','instructions'])if(item?.[key])$(key).value=item[key];TYPES.forEach(([key])=>{const value=['yes','no'].includes(item?.compatibility?.[key])?item.compatibility[key]:'unknown';$('form').elements[key].value=value});draftPhotos=(item?.photos||[]).map(x=>({...x}));renderDraft();$('formTitle').textContent=item?'주방용품 수정':'주방용품 등록';$('editor').hidden=false;$('name').focus();$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function closeEditor(){$('editor').hidden=true;editing=null;draftPhotos=[];renderDraft();$('form').reset()}
async function persist(id,data){const {data:row,error}=await sb.from('app_state').upsert({app:APP,key:id,data,updated_at:new Date().toISOString()},{onConflict:'app,key'}).select('key,data').single();if(error)throw error;if(!row)throw Error('저장 결과를 확인하지 못했습니다.');items=items.filter(x=>x.id!==id);if(!row.data.deleted)items.unshift({...row.data,id:row.key});}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy||!ready)return;const name=$('name').value.trim();if(!name){$('name').setCustomValidity('제품명을 입력해 주세요.');$('name').reportValidity();return}const id=editing||'item-'+(crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint32Array(4)),n=>n.toString(16)).join('-')),data={name,category:$('category').value,brand:$('brand').value.trim(),material:$('material').value.trim(),note:$('note').value.trim(),cooking:$('cooking').value.trim(),specs:$('specs').value.trim(),instructions:$('instructions').value.trim(),photos:[],compatibility:Object.fromEntries(TYPES.map(([key])=>[key,$('form').elements[key].value])),updatedAt:new Date().toISOString()};lock(true);status('저장하는 중…');try{data.photos=await savePhotos();await persist(id,data);closeEditor();status('저장했어요.')}catch(e){status('저장하지 못했어요. 입력 내용은 유지됩니다. 다시 저장해 주세요. ('+(e.message||'연결 오류')+')',true)}finally{lock(false)}});
$('name').addEventListener('input',()=>$('name').setCustomValidity(''));$('new').onclick=()=>openEditor();$('cancel').onclick=closeEditor;$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;
$('list').onclick=async e=>{const b=e.target.closest('button');if(!b||busy)return;const id=b.dataset.edit||b.dataset.delete||b.dataset.detail,item=items.find(x=>x.id===id);if(!item)return;if(b.dataset.detail){showDetail(item);return}if(b.dataset.edit){openEditor(item);return}if(editing===id){status('수정 중인 제품입니다. 저장하거나 취소한 뒤 삭제해 주세요.',true);return}if(!confirm('“'+item.name+'” 제품을 삭제할까요?'))return;lock(true);try{await persist(id,{...item,deleted:true,updatedAt:new Date().toISOString()});status('삭제했어요.')}catch(e){status('삭제하지 못했어요. 다시 시도해 주세요.',true)}finally{lock(false)}};
function uid(){return crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint32Array(4)),n=>n.toString(16)).join('-')}
function renderDraft(){$('photoDraft').innerHTML=draftPhotos.map((x,i)=>`<button type="button" data-remove-photo="${i}">${esc(x.name)} ×</button>`).join('')}
$('photoDraft').onclick=e=>{const b=e.target.closest('[data-remove-photo]');if(b&&!busy){draftPhotos.splice(Number(b.dataset.removePhoto),1);renderDraft()}};
$('photos').onchange=()=>{const files=[...$('photos').files];if(draftPhotos.length+files.length>6){status('사진은 최대 6장까지 첨부할 수 있어요.',true);$('photos').value='';return}if(files.some(f=>f.size>8*1024*1024||!/^image\/(jpeg|png|webp|gif)$/.test(f.type))){status('JPG·PNG·WebP·GIF 사진을 장당 8MB 이하로 첨부해 주세요.',true);$('photos').value='';return}draftPhotos.push(...files.map(file=>({id:'photo-'+uid(),name:file.name,type:file.type,file})));$('photos').value='';renderDraft()};
const readFile=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('사진을 읽지 못했습니다.'));reader.readAsDataURL(file)});
async function savePhotos(){const refs=[];for(const p of draftPhotos){if(p.file){const url=await readFile(p.file);const {data,error}=await sb.from('app_state').upsert({app:'kitchen-photo',key:p.id,data:{name:p.name,type:p.type,url},updated_at:new Date().toISOString()},{onConflict:'app,key'}).select('key').single();if(error)throw error;if(!data)throw Error('사진 저장 결과를 확인하지 못했습니다.')}refs.push({id:p.id,name:p.name,type:p.type})}return refs}
function clearPhotoURLs(){photoURLs.forEach(URL.revokeObjectURL);photoURLs=[]}
function chooseTab(key){document.querySelectorAll('[data-tab]').forEach(b=>{const selected=b.dataset.tab===key;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;$('detail-'+b.dataset.tab).hidden=!selected})}
function detailTabClick(e){const b=e.target.closest('[data-tab]');if(b)chooseTab(b.dataset.tab)}
document.querySelector('.detailtabs').onclick=detailTabClick;document.querySelector('.detailtabs').onkeydown=e=>{const keys=['specs','usage','photos'],i=keys.indexOf(e.target.dataset.tab);if(i<0||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;chooseTab(keys[next]);$('tab-'+keys[next]).focus()};
$('closeDetail').onclick=()=>$('detail').close();$('detail').addEventListener('close',()=>{detailGeneration++;clearPhotoURLs()});
async function showDetail(item){const generation=++detailGeneration;clearPhotoURLs();$('detailTitle').textContent=item.name;$('detail-specs').innerHTML=`<p>${[item.category,item.brand,item.material].filter(Boolean).map(esc).join(' · ')}</p><h3>상세 스펙</h3><div class="detailtext">${esc(item.specs||'등록된 상세 스펙이 없어요.')}</div><h3>비고 · 용량·사용 조건</h3><div class="detailtext">${esc(item.note||'등록된 비고가 없어요.')}</div>`;$('detail-usage').innerHTML=`<h3>요리 사용 예시</h3><div class="detailtext">${esc(item.cooking||'등록된 요리 사용 예시가 없어요.')}</div><h3>사용법·주의사항</h3><div class="detailtext">${esc(item.instructions||'등록된 사용법이 없어요.')}</div>`;chooseTab('specs');$('detail-photos').textContent=item.photos?.length?'사진을 불러오는 중…':'첨부한 사진이 없어요.';$('detail').showModal();
if(!item.photos?.length)return;try{const {data,error}=await sb.from('app_state').select('key,data').eq('app','kitchen-photo').in('key',item.photos.map(p=>p.id));if(error)throw error;if(generation!==detailGeneration)return;const rows=new Map((data||[]).map(r=>[r.key,r.data]));$('detail-photos').innerHTML='<div class="photogrid">'+item.photos.map(p=>{const photo=rows.get(p.id);if(!photo||!/^data:image\/(jpeg|png|webp|gif);base64,/.test(photo.url||''))return `<p>${esc(p.name)}: 사진을 불러오지 못했어요.</p>`;const [head,body]=photo.url.split(','),raw=atob(body),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:head.slice(5).split(';')[0]}));photoURLs.push(url);return `<figure><a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${esc(p.name)}" loading="lazy"></a><figcaption><a href="${url}" target="_blank" rel="noopener">${esc(p.name)} · 원본 새 탭으로 열기</a></figcaption></figure>`}).join('')+'</div>'}catch(e){if(generation===detailGeneration)$('detail-photos').textContent='사진을 불러오지 못했어요. 닫고 다시 열어 주세요.'}}
load();
})();</script></body></html>
