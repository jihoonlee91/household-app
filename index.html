<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#F3F5F6;--card:#fff;--ink:#15202A;--muted:#5B6873;--line:#D5DCE0;--accent:#0C7480;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#4DB8C2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#4DB8C2;color-scheme:dark}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#gate{min-height:100%;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;max-width:340px;width:100%;text-align:center}
h1{font-size:22px;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px;font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
.gh{background:#24292f;color:#fff;border:0;width:100%;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:600}
#msg{margin-top:14px;font-size:13px;color:var(--muted);min-height:1em}
#bar{display:none;position:fixed;top:0;left:0;right:0;height:38px;padding-top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);align-items:center;gap:8px;padding-inline:12px;font-size:13px;z-index:2}
#bar b{flex:1}#bar select,#bar button{padding:4px 8px;font-size:12.5px}
#app{display:none;position:fixed;left:0;right:0;bottom:0;top:calc(39px + env(safe-area-inset-top,0px));width:100%;height:calc(100% - 39px - env(safe-area-inset-top,0px));border:0}
</style></head><body>
<div id="gate"><div class="card"><h1>우리집</h1><p>지훈·상아 전용입니다.<br>GitHub 계정으로 로그인하세요.</p>
<button class="gh" id="login"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>GitHub로 로그인</button>
<div id="msg"></div></div></div>
<div id="bar"><b id="who"></b><select id="pick" aria-label="앱 고르기"></select><select id="theme" aria-label="화면 테마"><option value="">시스템</option><option value="light">라이트</option><option value="dark">다크</option></select><button id="out" type="button">로그아웃</button></div>
<iframe id="app" title="앱"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://jdidzokxoaxqcnraowyu.supabase.co","sb_publishable_sgaob3nqRHgAaKBs_4yclw_-Wq7stKH",{auth:{flowType:"pkce",persistSession:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), msg=t=>$("msg").textContent=t;
let timer=null, curApp=null;
/* 테마: 시스템 / 라이트 / 다크 — 셸과 열린 앱 둘 다에 적용 */
let theme=""; try{ theme=localStorage.getItem("hh-theme")||""; }catch(e){}
function applyTheme(){ const set=el=>{ if(!el) return; if(theme) el.setAttribute("data-theme",theme); else el.removeAttribute("data-theme"); };
  set(document.documentElement); try{ set($("app").contentDocument&&$("app").contentDocument.documentElement); }catch(e){} }
/* 앱(iframe) 쪽에서 쓰는 다리: 입력값을 부부 공용 DB(app_state)에 저장 */
window.__hh={sb,inputs:null,saveInputs(d){ clearTimeout(timer); timer=setTimeout(async()=>{ const {error}=await sb.from("app_state").upsert({app:curApp,key:"inputs",data:d,updated_at:new Date().toISOString()}); if(error) console.warn(error); },700); }};
$("theme").value=theme; applyTheme(); $("theme").onchange=e=>{ theme=e.target.value; try{localStorage.setItem("hh-theme",theme);}catch(_){} applyTheme(); };
$("app").addEventListener("load",applyTheme);
$("login").onclick=()=>{ msg("GitHub로 이동합니다…"); sb.auth.signInWithOAuth({provider:"github",options:{redirectTo:location.origin+location.pathname}}); };
$("out").onclick=async()=>{ await sb.auth.signOut(); location.replace(location.pathname); };
async function openApp(app){
  curApp=app; $("app").style.display="none"; msg("불러오는 중…");
  const [b,st]=await Promise.all([sb.from("app_bundles").select("html,title").eq("app",app).maybeSingle(), sb.from("app_state").select("data").eq("app",app).eq("key","inputs").maybeSingle()]);
  if(b.error||!b.data){ msg("앱을 불러오지 못했습니다."); return; }
  window.__hh.inputs=st.data?st.data.data:null; document.title=b.data.title+" · 우리집";
  $("gate").style.display="none"; $("bar").style.display="flex"; $("app").style.display="block"; $("app").srcdoc=b.data.html;
  history.replaceState(null,"","?app="+encodeURIComponent(app));
}
let booted=false;
async function boot(){
  const {data:{session}}=await sb.auth.getSession(); if(!session){ msg(""); return; }
  if(booted) return; booted=true;
  msg("확인 중…");
  const m=await sb.from("members").select("id,name,github_login");
  const me=(m.data||[]).find(x=>x.github_login===(session.user.user_metadata||{}).user_name);
  if(!m.data||!m.data.length){ msg("이 GitHub 계정은 접근 권한이 없습니다."); await sb.auth.signOut(); return; }
  $("who").textContent=(me?me.name:"우리집");
  const ORDER=["sim","ledger","items"]; const apps=await sb.from("app_bundles").select("app,title");
  (apps.data||[]).sort((a,b)=>((ORDER.indexOf(a.app)+99)%99)-((ORDER.indexOf(b.app)+99)%99));
  $("pick").innerHTML=(apps.data||[]).map(a=>`<option value="${a.app}">${a.title}</option>`).join("");
  const want=new URLSearchParams(location.search).get("app")||"sim"; $("pick").value=want; $("pick").onchange=e=>openApp(e.target.value);
  openApp(want);
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_IN") boot(); });
boot();
</script></body></html>
