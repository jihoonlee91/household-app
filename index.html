<style>
:root{--bg:#F3F5F6;--card:#fff;--ink:#15202A;--muted:#5B6873;--line:#D5DCE0;--accent:#0C7480;--up:#C2472F;--down:#1F5FAF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#4DB8C2;--accent-ink:#0E1419;--up:#EE7A62;--down:#6FA8F0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#4DB8C2;--accent-ink:#0E1419;--up:#EE7A62;--down:#6FA8F0;color-scheme:dark}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#gate{min-height:100%;display:grid;place-items:center;padding:16px;box-sizing:border-box}

h1{font-size:22px;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px;font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
.gh{background:#24292f;color:#fff;border:0;width:100%;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:600}
.install{width:100%;margin-top:9px;border-color:var(--accent);color:var(--accent);font-weight:700}.install[hidden]{display:none!important}
#msg{margin-top:14px;font-size:13px;color:var(--muted);min-height:1em}
#bar{display:none;position:fixed;top:0;left:0;right:0;height:38px;padding-top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);align-items:center;gap:8px;padding-inline:12px;font-size:13px;z-index:2}
/* PC(넓은 화면): 앱·테마를 드롭다운 대신 한 줄 버튼으로 바로 누르기 */
#tabsbar,#themeSeg{display:none}
@media (min-width:1100px){#bar #pick,#bar #theme{display:none}#bar b{flex:0 0 auto!important}
 #tabsbar{display:flex;flex:1;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}#tabsbar::-webkit-scrollbar{display:none}
 #tabsbar button,#themeSeg button{border:0;background:none;color:var(--muted);padding:5px 9px;border-radius:8px;font:inherit;font-size:12.5px;white-space:nowrap;cursor:pointer}

 #tabsbar button[aria-current="page"]{background:var(--gc,var(--accent));color:#fff;font-weight:700}#themeSeg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink,#fff);font-weight:700}

#home{display:none;max-width:720px;margin:0 auto;padding:calc(54px + env(safe-area-inset-top,0px)) 16px 32px;box-sizing:border-box}

@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{padding:12px;gap:4px;border-radius:12px}.tile b{font-size:15px}.tile .d{display:none}.tile .num{font-size:16px}.tile span{font-size:11.5px}.tile .ic{width:30px;height:30px;font-size:16px}}

.up{display:grid;gap:6px}.upi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.upi b{font:600 13px "IBM Plex Mono",ui-monospace,Consolas,Menlo,monospace;color:var(--accent);min-width:3.2em}.upi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.upi em{font-style:normal;color:var(--muted);font-size:12.5px}
.tile span{overflow-wrap:anywhere}
#app{display:none;position:fixed;left:0;right:0;bottom:0;top:calc(39px + env(safe-area-inset-top,0px));width:100%;height:calc(100% - 39px - env(safe-area-inset-top,0px));border:0}

.authed #gate{display:none}.authed #bar{display:flex}.authed #home{display:block}.authed-app #home{display:none}
#status{display:none;position:fixed;top:calc(45px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:13px;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.14);z-index:3;max-width:90%;text-align:center}
.authed #status:not(:empty){display:block}
@media (min-width:1280px){#home{max-width:none;padding-inline:28px}.tiles{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.up{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}}
.tile{align-content:start} /* 같은 줄 타일 높이가 달라도 내용은 위에서부터 (제목 줄이 들쭉날쭉하지 않게) */

/* ===== 메뉴: PC는 왼쪽 세로 메뉴(접기 가능), 휴대폰은 아래 탭 바 + '전체' 시트 ===== */
:root{--sw:228px}html.side-mini{--sw:64px}

@media (min-width:1100px){

 #bar b#who{flex:0 0 auto!important;display:block!important;font-size:15px;padding:2px 6px}
 #sideTog{display:block;align-self:flex-end;border:0;background:none;color:var(--muted);padding:2px 6px;font-size:16px}
 #tabsbar{flex-direction:column!important;flex:1!important;overflow:visible!important;gap:1px!important}
 #tabsbar button{text-align:left;padding:7px 10px!important;font-size:13.5px!important;border-radius:9px!important;border-bottom:0!important;border-left:3px solid transparent!important;display:flex;gap:8px;align-items:center}
 #tabsbar button[data-app]:not([data-app="home"]){border-left-color:color-mix(in srgb,var(--gc) 30%,transparent)!important}
 #tabsbar button[aria-current="page"]{border-left-color:var(--gc,var(--accent))!important}
 #tabsbar .tg{display:block;text-align:left;margin:12px 0 4px!important;border-left:0!important;background:none!important;padding:0 10px!important;font-size:11.5px!important;letter-spacing:.08em}
 #tabsbar .ti{display:inline!important;width:1.3em;text-align:center}
 #themeSeg{justify-content:space-between}#bar #installBar,#bar #out{width:100%}
 .authed #home{margin-left:var(--sw);padding-top:calc(24px + env(safe-area-inset-top,0px))}
 #app{left:var(--sw)!important;top:0!important;width:calc(100% - var(--sw))!important;height:100%!important}
 #status{top:12px;left:calc(50% + var(--sw)/2)}
 html.side-mini #tabsbar .ln,html.side-mini #tabsbar .tg,html.side-mini #bar #who,html.side-mini #themeSeg,html.side-mini #installBar,html.side-mini #out{display:none!important}
 html.side-mini #tabsbar button{justify-content:center;padding:8px 0!important}html.side-mini #sideTog{align-self:center}
}

 #allSheet .sopt{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}#themeSeg2{display:flex;gap:2px;border:1px solid var(--line);border-radius:10px;padding:2px}#themeSeg2 button{border:0;padding:5px 10px;font-size:12.5px;background:none}#themeSeg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink,#fff);font-weight:700}

/* 찾기 */
#qs{position:relative;margin:0 0 14px}#qsIn{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}#qsIn:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
#qsList{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);overflow:hidden}#qsList.on{display:block}
.qsi{display:grid;grid-template-columns:28px auto 1fr;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:10px 12px;color:var(--ink);font:inherit}.qsi:hover,.qsi.first{background:var(--bg)}.qsi i{font-style:normal;font-size:18px}.qsi span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qsn{padding:12px;color:var(--muted);font-size:13px}
.tile b .ls{display:none}

 #home .tile b .lf{display:none}#home .tile b .ls{display:inline}

 #tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px 4px;margin-top:6px}#tiles .grp{display:none}#tiles .tiles{display:contents!important}
 #home .tile{justify-items:center;align-content:start;text-align:center;padding:7px 1px 6px!important;gap:2px!important;border-radius:12px!important;min-height:0!important;border-left-width:1px!important;box-shadow:none!important}
 #home .tile{background:none!important;border:0!important}#home .tile::after{display:none}
 #home .tile .ic{width:44px!important;height:44px!important;font-size:22px!important;border-radius:14px;background:color-mix(in srgb,var(--gc) 16%,var(--card))!important;border:1px solid color-mix(in srgb,var(--gc) 30%,transparent)}
 #home .tile b{font-size:11.5px!important;font-weight:600;line-height:1.15;word-break:keep-all}
 #home .tile>span,#home .tile .bar{display:none!important}
 #home .tile .num{font-size:11px!important;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

}
@media (min-width:561px) and (max-width:1099px){ #tiles{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))!important;gap:14px 8px!important} #home .tile .ic{width:58px!important;height:58px!important;font-size:28px!important;border-radius:18px} #home .tile b{font-size:13.5px!important} #home .tile .num{font-size:12.5px!important} }
/* 디버그 */
#dbgBtn{position:fixed;left:10px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:12;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 10px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15)}#dbgBtn.bad{border-color:var(--up);color:var(--up);font-weight:700}
#dbgPanel{position:fixed;left:10px;right:10px;bottom:calc(110px + env(safe-area-inset-bottom,0px));max-height:60vh;overflow:auto;z-index:12;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (min-width:1100px){#dbgPanel{left:auto;width:560px}#dbgBtn{bottom:12px;left:auto;right:12px}#dbgPanel{bottom:52px}}
#dbgPanel .dh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}#dbgPanel .dh span{color:var(--muted);margin-right:auto}#dbgPanel button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:2px 8px;font-size:11.5px}
#dbgPanel h4{margin:8px 0 4px;font-size:12px}#dbgPanel .l{padding:2px 0;border-bottom:1px dashed var(--line);word-break:break-all}#dbgPanel .l i{color:var(--muted);font-style:normal;margin-right:4px}#dbgPanel .l.error b{color:var(--up)}#dbgPanel .l.warn b{color:#B7791F}#dbgPanel .l small{display:block;color:var(--muted)}#dbgPanel em{color:var(--muted)}
/* 당겨서 새로고침 표시 */
#ptr{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));z-index:9;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.15);color:var(--muted);font-size:18px;opacity:0;transform:translate(-50%,-50px);transition:opacity .15s;pointer-events:none}
#ptr.on{opacity:1}#ptr.ready{color:var(--accent);border-color:var(--accent)}#ptr.spin{animation:ptrspin .7s linear infinite;opacity:1;transform:translate(-50%,40px)}
@keyframes ptrspin{to{transform:translate(-50%,40px) rotate(360deg)}}
html{overscroll-behavior-y:contain}
/* ===== 메뉴 안의 탭 (자산 › 투자 › 10년 시뮬레이터 등) ===== */
#sub{display:none;position:fixed;z-index:3;left:0;right:0;top:env(safe-area-inset-top,0px);height:40px;box-sizing:border-box;gap:4px;padding:5px 10px;overflow-x:auto;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--line)}

  const scrolled=t=>{ for(let n=t;n&&n!==d.documentElement;n=n.parentElement){ if(n.scrollTop>0) return true; } return (w.scrollY||d.documentElement.scrollTop)>0; };
  w.addEventListener("touchstart",e=>{ y0=e.touches.length===1&&!scrolled(e.target)&&!e.target.closest("input,textarea,select,[contenteditable]")?e.touches[0].clientY:null; dy=0; },{passive:true});
  w.addEventListener("touchmove",e=>{ if(y0==null) return; dy=e.touches[0].clientY-y0; if(dy>10){ box.classList.add("on"); box.style.transform=`translate(-50%,${Math.min(dy,110)*0.6}px) rotate(${dy*2}deg)`; box.classList.toggle("ready",dy>80); } },{passive:true});
  w.addEventListener("touchend",()=>{ if(y0!=null&&dy>80){ box.classList.add("spin"); onRefresh(); setTimeout(()=>{ box.className=""; box.style.transform=""; },900); } else { box.className=""; box.style.transform=""; } y0=null; },{passive:true});
}catch(_){} }
// Supabase invokes this callback while holding its auth lock. Never call
// getSession or database APIs synchronously from inside it.
sb.auth.onAuthStateChange((ev)=>{
  if(ev==="SIGNED_IN"||ev==="TOKEN_REFRESHED"||ev==="INITIAL_SESSION") setTimeout(()=>boot(),0);
  if(ev==="SIGNED_OUT"&&booted) setTimeout(()=>location.replace(location.pathname),0);
});
/* 다른 탭·브라우저 창(예: 설치 앱 밖에서 열린 로그인 창)에서 로그인/로그아웃하면 이 창도 따라감 */
window.addEventListener("storage",e=>{ if(e.key!==AUTH_KEY) return; if(e.newValue&&!booted) boot(); if(!e.newValue&&booted) location.replace(location.pathname); });
document.addEventListener("visibilitychange",resumeAuth);
window.addEventListener("focus",resumeAuth);
window.addEventListener("pageshow",resumeAuth);
boot();
