<script>
/* 로그인 안정화
   - lock: supabase 기본 잠금(navigator.locks)은 같은 사이트의 모든 탭·설치 앱 창이 같이 씀. 예전 창 하나가 잠금을 쥐고 멈추면

   - detectSessionInUrl:false: 돌아온 주소(#access_token=…)는 아래에서 직접 읽어 setSession */
const AUTH_KEY="sb-jdidzokxoaxqcnraowyu-auth-token";
const sb=supabase.createClient("https://jdidzokxoaxqcnraowyu.supabase.co","sb_publishable_sgaob3nqRHgAaKBs_4yclw_-Wq7stKH",{auth:{flowType:"implicit",persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:AUTH_KEY,lock:async(_n,_t,fn)=>await fn()}});

const handoff=(async()=>{
  const at=authParams.get("access_token"), rt=authParams.get("refresh_token");
  if(!at&&!authError) return;

window.__hh={sb,inputs:null,open:app=>{ $("pick").value=app; openApp(app); },saveInputs(d){ const app=curApp; if(!app) return; clearTimeout(timer); timer=setTimeout(async()=>{ const {error}=await sb.from("app_state").upsert({app,key:"inputs",data:d,updated_at:new Date().toISOString()}); if(error) console.warn(error); },700); }};

async function simSnapshot(){

  if(!a.data||!b.data) return null;
  const last={}; b.data.forEach(x=>{ last[x.account_id]=x; });
  const v=x=>(last[x.id]||{}).amount||0, sum=f=>a.data.filter(f).reduce((s,x)=>s+v(x),0);
  const asof=Object.values(last).map(x=>x.as_of).sort().pop();

    jeonse:sum(x=>x.kind==="deposit"), car:sum(x=>x.kind==="other"&&(x.meta||{}).sim==="car"), pts:sum(x=>x.kind==="other"&&(x.meta||{}).sim!=="car")};

let booted=false, bootPromise=null;

async function resumeAuth(){
  if(document.visibilityState&&document.visibilityState!=="visible") return;
  if(!booted) await boot();
}
// Supabase invokes this callback while holding its auth lock. Never call
// getSession or database APIs synchronously from inside it.
sb.auth.onAuthStateChange((ev)=>{
  if(ev==="SIGNED_IN"||ev==="TOKEN_REFRESHED"||ev==="INITIAL_SESSION") setTimeout(()=>boot(),0);
  if(ev==="SIGNED_OUT"&&booted) setTimeout(()=>location.replace(location.pathname),0);
});
/* 다른 탭·브라우저 창(예: 설치 앱 밖에서 열린 로그인 창)에서 로그인/로그아웃하면 이 창도 따라감 */
window.addEventListener("storage",e=>{ if(e.key!==AUTH_KEY) return; if(e.newValue&&!booted) boot(); if(!e.newValue&&booted) location.replace(location.pathname); });
document.addEventListener("visibilitychange",resumeAuth);
window.addEventListener("focus",resumeAuth);
window.addEventListener("pageshow",resumeAuth);
boot();
