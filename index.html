<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#F3F5F6;--card:#fff;--ink:#15202A;--muted:#5B6873;--line:#D5DCE0;--accent:#0C7480;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#4DB8C2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1419;--card:#161E25;--ink:#E4EAEE;--muted:#9AA7B1;--line:#2A3641;--accent:#4DB8C2;color-scheme:dark}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#gate{min-height:100%;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;max-width:340px;width:100%;text-align:center}
h1{font-size:22px;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px;font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
.gh{background:#24292f;color:#fff;border:0;width:100%;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:600}
#msg{margin-top:14px;font-size:13px;color:var(--muted);min-height:1em}
#bar{display:none;position:fixed;top:0;left:0;right:0;height:38px;padding-top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);align-items:center;gap:8px;padding-inline:12px;font-size:13px;z-index:2}
#bar b{flex:1}#bar select,#bar button{padding:4px 8px;font-size:12.5px}
#home{display:none;max-width:720px;margin:0 auto;padding:calc(54px + env(safe-area-inset-top,0px)) 16px 32px;box-sizing:border-box}
#home h2{font-size:20px;margin:6px 0 2px}#home .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{display:grid;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);cursor:pointer;font:inherit}
.tile:hover{border-color:var(--accent)}.tile b{font-size:16px}.tile span{color:var(--muted);font-size:13px}
.tile .num{font:600 20px ui-monospace,Menlo,monospace;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg);font-size:18px}
#app{display:none;position:fixed;left:0;right:0;bottom:0;top:calc(39px + env(safe-area-inset-top,0px));width:100%;height:calc(100% - 39px - env(safe-area-inset-top,0px));border:0}
</style></head><body>
<div id="gate"><div class="card"><h1>우리집</h1><p>지훈·상아 전용입니다.<br>GitHub 계정으로 로그인하세요.</p>
<button class="gh" id="login"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>GitHub로 로그인</button>
<div id="msg"></div></div></div>
<div id="bar"><b id="who"></b><select id="pick" aria-label="앱 고르기"></select><select id="theme" aria-label="화면 테마"><option value="">시스템</option><option value="light">라이트</option><option value="dark">다크</option></select><button id="out" type="button">로그아웃</button></div>
<main id="home"><h2 id="hello">우리집</h2><p class="sub" id="hsub"></p><div class="tiles" id="tiles"></div></main>
<iframe id="app" title="앱"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://jdidzokxoaxqcnraowyu.supabase.co","sb_publishable_sgaob3nqRHgAaKBs_4yclw_-Wq7stKH",{auth:{flowType:"pkce",persistSession:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), msg=t=>$("msg").textContent=t;
let timer=null, curApp=null;
/* 테마: 시스템 / 라이트 / 다크 — 셸과 열린 앱 둘 다에 적용 */
let theme=""; try{ theme=localStorage.getItem("hh-theme")||""; }catch(e){}
function applyTheme(){ const set=el=>{ if(!el) return; if(theme) el.setAttribute("data-theme",theme); else el.removeAttribute("data-theme"); };
  set(document.documentElement); try{ set($("app").contentDocument&&$("app").contentDocument.documentElement); }catch(e){} }
/* 앱(iframe) 쪽에서 쓰는 다리: 입력값을 부부 공용 DB(app_state)에 저장 */
window.__hh={sb,inputs:null,open:app=>{ $("pick").value=app; openApp(app); },saveInputs(d){ const app=curApp; clearTimeout(timer); timer=setTimeout(async()=>{ const {error}=await sb.from("app_state").upsert({app,key:"inputs",data:d,updated_at:new Date().toISOString()}); if(error) console.warn(error); },700); }};
$("theme").value=theme; applyTheme(); $("theme").onchange=e=>{ theme=e.target.value; try{localStorage.setItem("hh-theme",theme);}catch(_){} applyTheme(); };
$("app").addEventListener("load",applyTheme);
$("login").onclick=()=>{ msg("GitHub로 이동합니다…"); sb.auth.signInWithOAuth({provider:"github",options:{redirectTo:location.origin+location.pathname}}); };
$("out").onclick=async()=>{ await sb.auth.signOut(); location.replace(location.pathname); };
const INFO={assets:{ic:"🏦",d:"통장·증권·대출 잔액 업데이트, 순자산 추이"},sim:{ic:"📈",d:"연봉·성과급·투자·집 매수·은퇴를 연도별로 굴려 보기 (자산 시뮬레이터)"},ledger:{ic:"🧾",d:"지출·수입 입력, 월별 합계와 예산 대비"},items:{ic:"🛋️",d:"가구·가전·장비 목록과 현재가치"},gifts:{ic:"🎁",d:"경조사·명절 주고받은 기록, 사람별 정리, 가족 일정"},trips:{ic:"✈️",d:"같이 다녀온 여행, 경비, 가고 싶은 곳"},wedding:{ic:"💍",d:"2023.8.15 결혼식 — 축의금·비용·식순·문서"}};
const fm=v=>v==null?"–":(Math.abs(v)>=1e8?(v/1e8).toFixed(1)+"억":Math.round(v/1e4).toLocaleString("ko-KR")+"만");
async function openHome(){
  curApp=null; $("app").style.display="none"; $("app").srcdoc=""; $("gate").style.display="none"; $("bar").style.display="flex"; $("home").style.display="block"; $("pick").value="home";
  document.title="우리집"; history.replaceState(null,"",location.pathname);
  const now=new Date(), ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const nx=new Date(now.getFullYear(),now.getMonth()+1,1), nym=nx.getFullYear()+"-"+String(nx.getMonth()+1).padStart(2,"0");
  const [tx,it,st,bl]=await Promise.all([sb.from("transactions").select("amount").gte("occurred_on",ym+"-01").lt("occurred_on",nym+"-01").lt("amount",0),
    sb.from("items").select("value_now,status"), sb.from("app_state").select("data").eq("app","sim").eq("key","inputs").maybeSingle(), sb.from("balances").select("account_id,as_of,amount").order("as_of")]);
  const lastB={}; (bl.data||[]).forEach(x=>lastB[x.account_id]=x); const netW=Object.values(lastB).reduce((s,x)=>s+x.amount,0), netAsof=Object.values(lastB).map(x=>x.as_of).sort().pop();
  const spent=(tx.data||[]).reduce((a,x)=>a-x.amount,0), budget=((st.data&&st.data.data&&st.data.data.monthly)||300)*1e4;
  const itemsV=(it.data||[]).filter(x=>!["판매함","폐기"].includes(x.status)).reduce((a,x)=>a+(x.value_now||0),0), itemsN=(it.data||[]).filter(x=>!["판매함","폐기"].includes(x.status)).length;
  const extra={assets:`<div class="num">${fm(netW)}</div><span>순자산 · ${netAsof||"잔액 입력 전"}</span>`,sim:`<span>자산 앱 최신 잔액에서 시작</span>`,ledger:`<div class="num">${fm(spent)}</div><span>이번 달 지출 · 예산 ${fm(budget)}</span>`,items:`<div class="num">${fm(itemsV)}</div><span>물건 ${itemsN}개 · 시세 입력분 합계</span>`};
  $("tiles").innerHTML=APPS.map(a=>`<button type="button" class="tile" data-app="${a.app}"><div class="ic">${(INFO[a.app]||{}).ic||"📄"}</div><b>${a.title}</b><span>${(INFO[a.app]||{}).d||""}</span>${extra[a.app]||""}</button>`).join("");
}
let APPS=[];
/* 시뮬레이터 시작값: 자산 앱 계좌별 최신 잔액 + 살림살이 현재 시세 합계 */
async function simSnapshot(){
  try{ await sb.functions.invoke("refresh-quotes",{body:{}}); }catch(e){}
  const [a,b,it,qs,mb]=await Promise.all([sb.from("accounts").select("id,name,kind,owner_id,rate,meta").eq("active",true), sb.from("balances").select("account_id,as_of,amount,updated_at").order("as_of"), sb.from("items").select("value_now,status"), sb.from("quotes").select("symbol,price").eq("symbol","005930").maybeSingle(), sb.from("members").select("id,birth_date")]);
  const birth=Object.fromEntries((mb.data||[]).map(m=>[m.id,m.birth_date]));
  if(!a.data||!b.data) return null;
  const last={}; b.data.forEach(x=>{ last[x.account_id]=x; });
  const v=x=>(last[x.id]||{}).amount||0, sum=f=>a.data.filter(f).reduce((s,x)=>s+v(x),0);
  const asof=Object.values(last).map(x=>x.as_of).sort().pop();
  const vals={cash:sum(x=>x.kind==="cash"), cheongMe:sum(x=>x.kind==="savings"&&/청약/.test(x.name)&&x.owner_id===1), cheongSp:sum(x=>x.kind==="savings"&&/청약/.test(x.name)&&x.owner_id===2),
    dojak:sum(x=>/청년도약/.test(x.name)), inv:sum(x=>x.kind==="invest"), opi:sum(x=>x.kind==="stock"), isa:sum(x=>x.kind==="isa"), pen:sum(x=>x.kind==="pension"), penCo:sum(x=>x.kind==="pension"&&/회사|사내/.test(x.name)), penIrp:sum(x=>x.kind==="pension"&&/IRP/.test(x.name)), penEtc:sum(x=>x.kind==="pension"&&!/회사|사내|IRP/.test(x.name)),
    jeonse:sum(x=>x.kind==="deposit"), car:sum(x=>x.kind==="other"&&(x.meta||{}).sim==="car"), pts:sum(x=>x.kind==="other"&&(x.meta||{}).sim!=="car")};
  const isaA=a.data.filter(x=>x.kind==="isa"); vals.isaPrincipal=isaA.reduce((s,x)=>s+(+(x.meta||{}).principal||v(x)),0);
  const dj=a.data.find(x=>/청년도약/.test(x.name)), irp=a.data.find(x=>x.kind==="pension"&&/IRP/.test(x.name)), params={};
  if(dj&&(dj.meta||{}).monthly) params.dojakMonthly=+dj.meta.monthly/1e4; if(dj&&dj.rate) params.dojakRate=+dj.rate;
  if(irp&&(irp.meta||{}).tdf_share!=null) params.irpSafePct=Math.round(+irp.meta.tdf_share*100);
  const list=a.data.map(x=>({name:x.name,kind:x.kind,owner:x.owner_id,amt:v(x),rate:x.rate?+x.rate:null})).filter(x=>x.amt!==0).sort((p,q)=>Math.abs(q.amt)-Math.abs(p.amt));
  const up=b.data.map(x=>x.updated_at).filter(Boolean).sort().pop(); const updatedAt=up?new Date(up).toLocaleString("sv-SE",{timeZone:"Asia/Seoul"}):null;
  const gear=(it.data||[]).filter(x=>!["판매함","폐기"].includes(x.status)).reduce((s,x)=>s+(x.value_now||0),0); if(gear) vals.gear=gear;
  const debts=a.data.filter(x=>x.kind==="loan"&&v(x)<0).map(x=>{ const d={n:x.name,b:-v(x),r:+x.rate||0,o:x.owner_id}; if(/HF|전세대출|전월세/.test(x.name)) d.hf=true; if(/학자금/.test(x.name)){ d.amort=2.69e6; d.keep=true; } return d; });
  return {asof,updatedAt,birth,list,params,vals,debts,ssPrice:qs&&qs.data?Number(qs.data.price):null};
}
/* 셸이 새 버전으로 배포됐으면 앱을 열 때 새로고침 (열어 둔 탭이 예전 셸로 새 앱을 여는 문제 방지) */
let shellTag=null; const tagOf=async()=>{ try{ const r=await fetch(location.pathname,{method:"HEAD",cache:"no-store"}); return r.headers.get("etag")||r.headers.get("last-modified"); }catch(e){ return null; } };
tagOf().then(t=>shellTag=t);
async function openApp(app){
  if(app!=="home"&&shellTag){ const t=await tagOf(); if(t&&t!==shellTag){ location.href=location.pathname+"?app="+encodeURIComponent(app); return; } }
  if(app==="home"){ openHome(); return; }
  curApp=app; $("home").style.display="none"; $("app").style.display="none"; msg("불러오는 중…");
  const [b,st]=await Promise.all([sb.from("app_bundles").select("html,title").eq("app",app).maybeSingle(), sb.from("app_state").select("data").eq("app",app).eq("key","inputs").maybeSingle()]);
  if(b.error||!b.data){ msg("앱을 불러오지 못했습니다."); return; }
  window.__hh.inputs=st.data?st.data.data:null; window.__hh.snapshot=app==="sim"? await simSnapshot() : null; document.title=b.data.title+" · 우리집";
  $("gate").style.display="none"; $("bar").style.display="flex"; $("app").style.display="block"; $("app").srcdoc=b.data.html;
  history.replaceState(null,"","?app="+encodeURIComponent(app));
}
let booted=false;
async function boot(){
  const {data:{session}}=await sb.auth.getSession(); if(!session){ msg(""); return; }
  if(booted) return; booted=true;
  msg("확인 중…");
  const m=await sb.from("members").select("id,name,github_login");
  const me=(m.data||[]).find(x=>x.github_login===(session.user.user_metadata||{}).user_name);
  if(!m.data||!m.data.length){ msg("이 GitHub 계정은 접근 권한이 없습니다."); await sb.auth.signOut(); return; }
  $("who").textContent=(me?me.name:"우리집");
  const ORDER=["assets","ledger","items","sim","gifts","trips","wedding"]; const apps=await sb.from("app_bundles").select("app,title");
  (apps.data||[]).sort((a,b)=>((ORDER.indexOf(a.app)+99)%99)-((ORDER.indexOf(b.app)+99)%99));
  APPS=apps.data||[];
  $("pick").innerHTML=`<option value="home">🏠 홈</option>`+APPS.map(a=>`<option value="${a.app}">${a.title}</option>`).join("");
  $("hello").textContent=`${me?me.name:""}님, 안녕하세요`; $("hsub").textContent="지훈·상아 가계 앱";
  $("tiles").onclick=e=>{ const t=e.target.closest(".tile"); if(t){ $("pick").value=t.dataset.app; openApp(t.dataset.app); } };
  const want=new URLSearchParams(location.search).get("app")||"home"; $("pick").value=want; $("pick").onchange=e=>openApp(e.target.value);
  openApp(want);
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_IN") boot(); });
boot();
</script></body></html>
