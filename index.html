addEventListener("keydown",e=>{ if(!booted) return; const k=e.key.toLowerCase(); if((e.ctrlKey||e.metaKey)&&k==="k"){ e.preventDefault(); focusSearch(); } else if(k==="/"&&!/input|textarea|select/i.test((document.activeElement||{}).tagName||"")){ e.preventDefault(); focusSearch(); } });
/* ===== 디버그 모드 (?debug=1 또는 진단 화면에서 켜기): 화면 구석 🐞 버튼 → 최근 로그·요청·도구 ===== */
window.hhSetDebug=on=>{ try{ localStorage.setItem("hh-debug",on?"1":"0"); }catch(_){} window.HH_DEBUG=on; dbgInit(); };
window.hhClearCaches=async()=>{ await clearBundleCache(); try{ for(const k of await caches.keys()) await caches.delete(k); }catch(_){} try{ const rs=await navigator.serviceWorker.getRegistrations(); for(const r of rs) await r.update(); }catch(_){} location.reload(); };
function dbgInit(){ let b=$("dbgBtn"); if(!window.HH_DEBUG){ if(b) b.remove(); const p=$("dbgPanel"); if(p) p.remove(); window.hhDebugPanel=null; return; }
  if(b) return; b=document.createElement("button"); b.id="dbgBtn"; b.type="button"; b.title="디버그"; document.body.appendChild(b);
  const p=document.createElement("div"); p.id="dbgPanel"; p.hidden=true; document.body.appendChild(p);
  const ago=t=>Math.round((Date.now()-t)/1000)+"초 전";
  window.hhDebugPanel=()=>{ const L=window.hhDebugLog, n=L.filter(x=>x.level==="error").length; b.textContent="🐞"+(n?" "+n:""); b.classList.toggle("bad",n>0);
    if(p.hidden) return;
    p.innerHTML=`<div class="dh"><b>디버그</b><span>셸 ${esc(window.HH_VER||"")} · ${esc(curApp||"홈")}</span><button data-x="send">로그 보내기</button><button data-x="cache">캐시 비우기</button><button data-x="off">끄기</button><button data-x="close">닫기</button></div>
      <div class="dc"><h4>로그</h4>${L.slice(-40).reverse().map(x=>`<div class="l ${x.level}"><i>${x.at.slice(11,19)}</i><b>${x.level}</b> ${esc(x.app||"")} ${esc(x.message)}${Object.keys(x.detail||{}).length?`<small>${esc(JSON.stringify(x.detail).slice(0,300))}</small>`:""}</div>`).join("")||"없음"}</div>
      <div class="dc"><h4>요청</h4>${window.hhReqs.slice(-30).reverse().map(r=>`<div class="l ${r.status>=400?"error":r.ms>1500?"warn":""}"><i>${ago(r.at)}</i><b>${r.status}</b> ${esc(r.name)} <em>${r.ms}ms</em></div>`).join("")||"없음"}</div>`; };
  b.onclick=()=>{ p.hidden=!p.hidden; window.hhDebugPanel(); };
  p.onclick=e=>{ const x=e.target.dataset.x; if(x==="close"){ p.hidden=true; } if(x==="off") window.hhSetDebug(false); if(x==="send"){ flushLogs(); e.target.textContent="보냄"; } if(x==="cache") window.hhClearCaches(); };
  window.hhDebugPanel(); }
setTimeout(dbgInit,0);
/* ===== 로그인 유지·자동 로그인·돌아왔을 때 새로고침 =====
   - 화면이 보일 때만 토큰 자동 갱신(숨기면 멈춤 → 배터리), 돌아오면 만료 5분 전이면 미리 갱신
   - 10분 넘게 쉬었다 오면: 새 셸이면 그 자리 새로고침, 아니면 앱 목록·지금 화면 데이터를 새로
   - 자동 로그인: 이 기기에서 로그인한 적 있고 직접 로그아웃하지 않았으면, 세션이 끊겨도 바로 GitHub 로그인으로 (한 번만 시도) */
let hiddenAt=0;
async function resumeAuth(){
  if(document.visibilityState&&document.visibilityState!=="visible"){ if(!hiddenAt) hiddenAt=Date.now(); try{ sb.auth.stopAutoRefresh(); }catch(_){} return; }
  try{ sb.auth.startAutoRefresh(); }catch(_){}
  if(!booted){ await boot(); return; }
  const away=hiddenAt?Date.now()-hiddenAt:0; hiddenAt=0;
  await ensureFreshToken();
  if(away>10*60e3){
    verAt=Date.now(); const v=await shellVer(); if(v&&/^v\d+$/.test(window.HH_VER||"")&&v!==window.HH_VER){ location.reload(); return; }
    await refreshApps(); refreshView();
  }
}
async function ensureFreshToken(){ try{
  const {data:{session}}=await sb.auth.getSession(); if(!session||!session.expires_at) return;
  if(session.expires_at*1000-Date.now()>5*60e3) return;
  const {error}=await sb.auth.refreshSession(); if(!error) return;
  hhLog("warn","로그인 갱신 실패",{err:error.message});
  if(navigator.onLine!==false&&/refresh|invalid|expired|not found/i.test(error.message)){ booted=false; unauth(); autoLogin(); }
}catch(e){ hhLog("warn","로그인 확인 실패",{err:String(e).slice(0,200)}); } }
async function refreshApps(){ const r=await sb.from("app_bundles").select("app,title,version"); if(!r.data) return; let added=false; r.data.forEach(n=>{ const o=APPS.find(a=>a.app===n.app); if(o){ o.version=n.version; if(n.title) o.title=n.title; } else if(n.app!=="_common"){ APPS.push(n); added=true; } }); if(added){ location.reload(); return; } COMMON=r.data.find(a=>a.app==="_common")||COMMON; }
function refreshView(){ poolStaleAll(); if(curApp) openApp(curApp,true,true); else openHome(); }
function autoLogin(){
  try{ if(localStorage.getItem("hh-auto-login")!=="on"||authError||sessionStorage.getItem("hh-auto-tried")) return false; sessionStorage.setItem("hh-auto-tried","1"); }catch(_){ return false; }
  if(navigator.onLine===false) return false;
  msg("자동 로그인 중…"); $("login").click(); return true; }
window.addEventListener("online",()=>{ try{ sb.auth.startAutoRefresh(); }catch(_){} flushLogs(); if(!booted) boot(); else ensureFreshToken(); });
/* ===== 당겨서 새로고침 (휴대폰): 화면 맨 위에서 아래로 당기면 지금 화면을 새로 ===== */
function ptr(w,onRefresh){ try{
  const d=w.document; d.documentElement.style.overscrollBehaviorY="contain";
  let y0=null, x0=0, dy=0; const box=$("ptr");
  const scrolled=t=>{ for(let n=t;n&&n!==d.documentElement;n=n.parentElement){ if(n.scrollTop>0) return true; } return (w.scrollY||d.documentElement.scrollTop)>0; };
  w.addEventListener("touchstart",e=>{ y0=e.touches.length===1&&!scrolled(e.target)&&!e.target.closest("input,textarea,select,[contenteditable]")?e.touches[0].clientY:null; x0=e.touches.length===1?e.touches[0].clientX:0; dy=0; },{passive:true});
  w.addEventListener("touchmove",e=>{ if(y0==null) return; dy=e.touches[0].clientY-y0;
    /* 옆으로 미는 중(좌우 스와이프)이면 당겨서 새로고침은 취소 */ if(Math.abs(e.touches[0].clientX-x0)>Math.max(dy,10)){ y0=null; dy=0; box.className=""; box.style.transform=""; return; }
    if(dy>10){ box.classList.add("on"); box.style.transform=`translate(-50%,${Math.min(dy,110)*0.6}px) rotate(${dy*2}deg)`; box.classList.toggle("ready",dy>80); } },{passive:true});
  w.addEventListener("touchend",()=>{ if(y0!=null&&dy>80){ box.classList.add("spin"); onRefresh(); setTimeout(()=>{ box.className=""; box.style.transform=""; },900); } else { box.className=""; box.style.transform=""; } y0=null; },{passive:true});
}catch(_){} }
// Supabase invokes this callback while holding its auth lock. Never call
// getSession or database APIs synchronously from inside it.
sb.auth.onAuthStateChange((ev)=>{
  if(ev==="SIGNED_IN"||ev==="TOKEN_REFRESHED"||ev==="INITIAL_SESSION") setTimeout(()=>boot(),0);
  if(ev==="SIGNED_OUT"&&booted) setTimeout(()=>location.replace(location.pathname),0);
});
/* 다른 탭·브라우저 창(예: 설치 앱 밖에서 열린 로그인 창)에서 로그인/로그아웃하면 이 창도 따라감 */
window.addEventListener("storage",e=>{ if(e.key!==AUTH_KEY) return; if(e.newValue&&!booted) boot(); if(!e.newValue&&booted) location.replace(location.pathname); });
document.addEventListener("visibilitychange",resumeAuth);
window.addEventListener("focus",resumeAuth);
window.addEventListener("pageshow",resumeAuth);
boot();
</script></body></html>
